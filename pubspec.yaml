name: fahem
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  cupertino_icons: ^1.0.8
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  youtube_player_flutter: ^10.0.1
  video_player: ^2.11.1
  cloud_firestore: ^6.6.0
  http: ^1.6.0
  youtube_player_iframe: ^6.0.2
  image_picker: ^1.2.2
  url_launcher: ^6.3.2

  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21  

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    # - images/a_dot_ham.jpeg

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 900
